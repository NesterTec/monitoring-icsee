services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: icsee-go2rtc
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./go2rtc.generated.yaml:/config/go2rtc.yaml

  app:
    build: ./app
    container_name: icsee-nvr
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: sqlite:////data/nvr.db
      DEFAULT_STORAGE_PATH: /recordings
      GO2RTC_CONFIG_PATH: /data/go2rtc.generated.yaml
      GO2RTC_API: http://127.0.0.1:1984
      # Same-origin via nginx edge (/rtc) — works on LAN and ngrok
      GO2RTC_PUBLIC_URL: /rtc
    volumes:
      - ./app/data:/data
      - ./recordings:/recordings
      - ./go2rtc.generated.yaml:/data/go2rtc.generated.yaml
    depends_on:
      - go2rtc

  edge:
    image: nginx:alpine
    container_name: icsee-edge
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - go2rtc
