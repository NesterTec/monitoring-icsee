{% extends "base.html" %}
{% block title %}{% if camera %}Editar{% else %}Nova{% endif %} câmera{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>{% if camera %}Editar câmera{% else %}Nova câmera{% endif %}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{% if camera %}/cameras/{{ camera.id }}{% else %}/cameras/create{% endif %}">
    <label>Nome</label>
    <input name="name" required value="{{ camera.name if camera else '' }}">
    <label>IP / host</label>
    <input name="host" required value="{{ camera.host if camera else '' }}" placeholder="192.168.1.15">
    <label>Usuário do dispositivo</label>
    <input name="username" required value="{{ camera.username if camera else '' }}">
    <label>Senha do dispositivo{% if camera %} (deixe em branco para manter){% endif %}</label>
    <input name="password" type="password" {% if not camera %}required{% endif %}>
    <label>Porta RTSP</label>
    <input name="rtsp_port" type="number" value="{{ camera.rtsp_port if camera else 554 }}">
    <label>Canal</label>
    <input name="channel" type="number" value="{{ camera.channel if camera else 1 }}">
    <label>Stream sub (live)</label>
    <input name="stream_sub" type="number" value="{{ camera.stream_sub if camera else 1 }}">
    <label>Stream main (gravação)</label>
    <input name="stream_main" type="number" value="{{ camera.stream_main if camera else 0 }}">
    <label class="checkbox"><input type="checkbox" name="enabled" {% if not camera or camera.enabled %}checked{% endif %}> Ativa (live)</label>
    <label class="checkbox"><input type="checkbox" name="recording_enabled" {% if not camera or camera.recording_enabled %}checked{% endif %}> Gravação contínua</label>
    <p style="margin-top:1rem" class="row">
      <button type="submit">Salvar</button>
      <a class="btn btn-secondary" href="/cameras">Cancelar</a>
    </p>
  </form>
</div>
{% endblock %}
