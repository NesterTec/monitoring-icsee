<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ camera.name }} — tela cheia</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
      padding: 0.5rem 0.75rem;
      padding-top: max(0.5rem, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
    }
    .bar a, .bar button {
      color: #fff; background: rgba(40,40,40,.9); border: 0;
      padding: 0.55rem 0.75rem; border-radius: 8px; cursor: pointer;
      text-decoration: none; font-size: 0.9rem; min-height: 40px;
    }
    .bar button.is-hd { background: rgba(74, 163, 240, 0.85); color: #0b1017; font-weight: 700; }
    .bar .title { flex: 1 1 8rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .stage iframe {
      border: 0; background: #000;
      width: 100%; height: 100%;
    }
    body.rotated .stage iframe {
      width: 100dvh;
      height: 100dvw;
      max-width: none;
      transform: rotate(90deg);
      transform-origin: center center;
    }
    body.rotated .bar { opacity: 0.35; }
    body.rotated .bar:hover,
    body.rotated .bar:focus-within { opacity: 1; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title">{{ camera.name }} · {{ camera.host }}</div>
    <button type="button" id="btn-quality" aria-pressed="false" title="Qualidade do stream">SD</button>
    <button type="button" id="btn-rotate" onclick="toggleRotate()">Girar ⟲</button>
    <button type="button" onclick="goFs()">Tela cheia</button>
    <a href="{{ base_path|default('') }}/">Voltar</a>
  </div>
  <div class="stage" id="stage">
    <iframe
      id="player"
      data-stream-sd="{{ go2rtc_public }}/stream.html?src=cam_{{ camera.id }}"
      data-stream-hd="{{ go2rtc_public }}/stream.html?src=cam_{{ camera.id }}_hd"
      src="about:blank"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>
  </div>
  <script>
    const CAMERA_ID = {{ camera.id }};
    const QUALITY_KEY = 'icsee_live_quality_' + CAMERA_ID;
    const player = document.getElementById('player');
    const qualityBtn = document.getElementById('btn-quality');
    let rotated = false;

    function getQuality() {
      try {
        return localStorage.getItem(QUALITY_KEY) === 'hd' ? 'hd' : 'sd';
      } catch (_) {
        return 'sd';
      }
    }

    function applyQuality(q) {
      const src = q === 'hd' ? player.dataset.streamHd : player.dataset.streamSd;
      if (player.getAttribute('src') !== src) player.src = src;
      qualityBtn.textContent = q === 'hd' ? 'HD' : 'SD';
      qualityBtn.setAttribute('aria-pressed', q === 'hd' ? 'true' : 'false');
      qualityBtn.classList.toggle('is-hd', q === 'hd');
    }

    qualityBtn.addEventListener('click', () => {
      const next = getQuality() === 'hd' ? 'sd' : 'hd';
      try { localStorage.setItem(QUALITY_KEY, next); } catch (_) {}
      applyQuality(next);
    });

    applyQuality(getQuality());

    async function lockLandscape() {
      try {
        const o = screen.orientation;
        if (o && o.lock) {
          await o.lock('landscape');
          return true;
        }
      } catch (_) {}
      return false;
    }

    async function unlockOrientation() {
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch (_) {}
    }

    async function toggleRotate() {
      rotated = !rotated;
      document.body.classList.toggle('rotated', rotated);
      const btn = document.getElementById('btn-rotate');
      btn.textContent = rotated ? 'Normal ⟳' : 'Girar ⟲';
      if (rotated) {
        if (!document.fullscreenElement) {
          try { await goFs(); } catch (_) {}
        }
        const locked = await lockLandscape();
        if (locked) {
          document.body.classList.remove('rotated');
          rotated = false;
          btn.textContent = 'Travado em paisagem (toque Normal para soltar)';
          btn.dataset.native = '1';
        }
      } else {
        if (btn.dataset.native === '1') {
          await unlockOrientation();
          delete btn.dataset.native;
          btn.textContent = 'Girar ⟲';
        }
      }
    }

    async function goFs() {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    }
  </script>
</body>
</html>
