<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2332">
  <title>{% block title %}ICSEE NVR{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
{% if user is defined and user %}
<header id="topnav">
  <div class="header-inner">
    <div class="brand">ICSEE NVR</div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav id="main-nav">
      <a href="/">Live</a>
      <a href="/cameras">Câmeras</a>
      <a href="/recordings">Gravações</a>
      <a href="/settings">Configurações</a>
    </nav>
    <div class="notif-wrap" id="notif-wrap">
      <button type="button" class="notif-btn" id="notif-btn" aria-label="Notificações" aria-expanded="false" aria-haspopup="true">
        <span class="notif-icon" aria-hidden="true">🔔</span>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
      <div class="notif-panel" id="notif-panel" hidden>
        <p class="notif-empty" id="notif-empty">Nenhuma notificação</p>
        <ul class="notif-list" id="notif-list"></ul>
      </div>
    </div>
    <form class="logout-form" method="post" action="/logout">
      <button class="btn-secondary" type="submit">Sair</button>
    </form>
  </div>
</header>

<div class="modal" id="camera-lost-modal" hidden>
  <div class="modal-backdrop" data-close-lost-modal></div>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="camera-lost-title">
    <h2 id="camera-lost-title">Câmera perdida</h2>
    <p id="camera-lost-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn" data-close-lost-modal>Entendi</button>
    </div>
  </div>
</div>

<script>
(function () {
  const header = document.getElementById('topnav');
  const btn = document.getElementById('nav-toggle');
  if (header && btn) {
    btn.addEventListener('click', () => {
      const open = header.classList.toggle('nav-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.textContent = open ? '✕' : '☰';
    });
  }

  const notifBtn = document.getElementById('notif-btn');
  const notifPanel = document.getElementById('notif-panel');
  const notifBadge = document.getElementById('notif-badge');
  const notifList = document.getElementById('notif-list');
  const notifEmpty = document.getElementById('notif-empty');
  const modal = document.getElementById('camera-lost-modal');
  const modalMsg = document.getElementById('camera-lost-message');
  let items = [];

  function seenKey(id) { return 'icsee_seen_notif_' + id; }

  function showModal(item) {
    if (!modal || !modalMsg) return;
    modalMsg.textContent = item.message;
    modal.hidden = false;
    document.body.classList.add('modal-open');
    try { sessionStorage.setItem(seenKey(item.id), '1'); } catch (e) {}
  }

  function closeModal() {
    if (!modal) return;
    modal.hidden = true;
    document.body.classList.remove('modal-open');
  }

  document.querySelectorAll('[data-close-lost-modal]').forEach((el) => {
    el.addEventListener('click', closeModal);
  });

  function renderList() {
    if (!notifList || !notifEmpty || !notifBadge) return;
    notifList.innerHTML = '';
    if (!items.length) {
      notifEmpty.hidden = false;
      notifBadge.hidden = true;
      return;
    }
    notifEmpty.hidden = true;
    notifBadge.hidden = false;
    notifBadge.textContent = String(items.length);
    items.forEach((item) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'notif-item';
      b.textContent = item.message;
      b.addEventListener('click', () => {
        showModal(item);
        if (notifPanel) notifPanel.hidden = true;
        if (notifBtn) notifBtn.setAttribute('aria-expanded', 'false');
      });
      li.appendChild(b);
      notifList.appendChild(li);
    });
  }

  async function refreshNotifications() {
    try {
      const r = await fetch('/notifications', { headers: { 'Accept': 'application/json' } });
      if (!r.ok) return;
      const data = await r.json();
      items = data.items || [];
      renderList();
      for (const item of items) {
        let seen = false;
        try { seen = sessionStorage.getItem(seenKey(item.id)) === '1'; } catch (e) {}
        if (!seen) {
          showModal(item);
          break;
        }
      }
    } catch (e) {}
  }

  if (notifBtn && notifPanel) {
    notifBtn.addEventListener('click', () => {
      const open = notifPanel.hidden;
      notifPanel.hidden = !open;
      notifBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (ev) => {
      const wrap = document.getElementById('notif-wrap');
      if (wrap && !wrap.contains(ev.target)) {
        notifPanel.hidden = true;
        notifBtn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  refreshNotifications();
  setInterval(refreshNotifications, 30000);
})();
</script>
{% endif %}
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
