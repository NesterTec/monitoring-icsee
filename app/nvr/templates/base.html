<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2332">
  <title>{% block title %}ICSEE NVR{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>
{% if user is defined and user %}
<header id="topnav">
  <div class="header-inner">
    <div class="brand">ICSEE NVR</div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav id="main-nav">
      <a href="/">Live</a>
      <a href="/cameras">Câmeras</a>
      <a href="/recordings">Gravações</a>
      <a href="/settings">Configurações</a>
    </nav>
    <form class="logout-form" method="post" action="/logout">
      <button class="btn-secondary" type="submit">Sair</button>
    </form>
  </div>
</header>
<script>
(function () {
  const header = document.getElementById('topnav');
  const btn = document.getElementById('nav-toggle');
  if (!header || !btn) return;
  btn.addEventListener('click', () => {
    const open = header.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.textContent = open ? '✕' : '☰';
  });
})();
</script>
{% endif %}
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
