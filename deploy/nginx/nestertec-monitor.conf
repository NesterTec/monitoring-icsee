# Colar no server { listen 443 ... } do NesterStore
# (arquivo: /var/www/store/docker/nginx/production.ssl.conf).
# ICSEE usa network_mode:host na :8090; do container nesterstore-nginx
# o host é o gateway da rede store (ex.: 172.18.0.1).

location = /adm/house/monitor {
    return 301 /adm/house/monitor/;
}

location /adm/house/monitor/ {
    rewrite ^/adm/house/monitor/?(.*)$ /$1 break;
    proxy_pass http://172.18.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /adm/house/monitor;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
}
