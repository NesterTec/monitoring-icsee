# Snippet para o server {} de nestertec.com (HTTPS já existente).
# Proxy strip: browser fala /adm/house/monitor/... ; app/edge escuta em :8090 com paths /.

location /adm/house/monitor/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
}

# Opcional explícito (coberto pelo bloco acima se edge já mapeia /rtc):
# location /adm/house/monitor/rtc/ {
#     proxy_pass http://127.0.0.1:1984/;
#     ...
# }
